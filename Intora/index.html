<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />

    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/svg+xml" href="./public/fac.svg" />
    <title>Intora BuildTech</title>

    <link rel="stylesheet" href="./src/css/plugin.css" />

    <!-- Core Style Css -->
    <link rel="stylesheet" href="./src/index.css" />
    <link rel="stylesheet" href="./src/css/twentytwenty.css" />

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Teko:300,400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Playfair+Display:400,500,600,700,800,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
    <!-- Link to Slick Carousel styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.css">
    <!-- Link to WOW.js animation library -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css">
  </head>

  <body class="pace-done">
    <div class="pace pace-inactive">
      <div
        class="pace-progress"
        data-progress-text="100%"
        data-progress="99"
        style="transform: translate3d(100%, 0px, 0px)"
      >
        <div class="pace-progress-inner"></div>
      </div>
      <div class="pace-activity"></div>
    </div>

    <!-- ==================== Start Loading ==================== -->

    <div id="preloader">
      <div class="loading-text">Loading</div>
    </div>

   
    <!-- ==================== End Loading ==================== -->

    <!-- ==================== Start progress-scroll-button ==================== -->

    <div class="progress-wrap cursor-pointer">
      <svg
        class="progress-circle svg-content"
        width="100%"
        height="100%"
        viewBox="-1 -1 102 102"
      >
        <path
          d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98"
          style="
            transition: stroke-dashoffset 10ms linear;
            stroke-dasharray: 307.919, 307.919;
            stroke-dashoffset: 307.919;
          "
        ></path>
      </svg>
    </div>

    <!-- ==================== End progress-scroll-button ==================== -->

    <!-- ==================== Start cursor ==================== -->

    <div
      class="mouse-cursor cursor-outer"
      style="visibility: visible; transform: translate(950px, 636px)"
    ></div>
    <div
      class="mouse-cursor cursor-inner"
      style="visibility: visible; transform: translate(950px, 636px)"
    ></div>


    

    <!-- ==================== End cursor ==================== -->

    <div id="root"></div>

    <!-- Load jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Then load jQuery Migrate -->
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pace/1.0.2/pace.min.js"></script>

    <!-- Plugins -->
    <script src="./src/js/plugins.js"></script>

    <!-- Custom Scripts -->
    <script src="./src/js/scripts.js"></script>
    <!-- Map -->
    <!-- google map api -->

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
